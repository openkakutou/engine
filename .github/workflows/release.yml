name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build WASM module
        run: GOOS=js GOARCH=wasm go build -o engine.wasm ./cmd/wasm

      - name: Copy wasm_exec.js glue
        run: |
          src="$(go env GOROOT)/lib/wasm/wasm_exec.js"
          test -f "$src" || { echo "wasm_exec.js not found at expected path: $src" >&2; exit 1; }
          cp "$src" wasm_exec.js

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            engine.wasm
            wasm_exec.js
          fail_on_unmatched_files: true
